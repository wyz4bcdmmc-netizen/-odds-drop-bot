import os
import json
from urllib.request import Request, urlopen
from urllib.parse import urlencode

API_KEY = os.environ["ODDS_API_KEY"]

params = urlencode({
    "apiKey": API_KEY
})

url = f"https://api.the-odds-api.com/v4/sports?{params}"

request = Request(
    url,
    headers={"User-Agent": "odds-drop-bot/1.0"}
)

try:
    with urlopen(request, timeout=15) as response:
        sports = json.loads(response.read().decode("utf-8"))

except Exception as e:
    print("ERREUR API :", e)
    raise

print("\n=== FOOTBALL DISPONIBLE ===\n")

football = []

for sport in sports:
    if "soccer" in sport.get("key", "").lower():
        football.append(sport)
        print(
            f'{sport["key"]} | '
            f'{sport["title"]} | '
            f'actif={sport["active"]}'
        )

print(f"\nNombre de compétitions football : {len(football)}")
